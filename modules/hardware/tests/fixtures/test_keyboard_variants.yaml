model: test-kb-variants
display_name: "Test Keyboard Variants"
description: "Fixture avec layout_variants pour les tests unitaires."
split: false
mcu_options:
  - id: test_mcu
    display_name: "Test MCU"
    description: "MCU de test."
    bootloader: "test-boot"
    pins:
      matrix_rows: ["D0", "D1"]
      matrix_cols: ["F0", "F1", "F2"]
diode_direction: "COL2ROW"
layout_macro: "LAYOUT_test"
has_encoder: false
capabilities:
  oled: false
  rgb: false
matrix:
  rows: 2
  cols: 3
layout_variants:
  - slug: compact
    label: "Compact (5 touches)"
    keys:
      - {row: 0, col: 0, x: 0, y: 0}
      - {row: 0, col: 1, x: 1, y: 0}
      - {row: 0, col: 2, x: 2, y: 0}
      - {row: 1, col: 0, x: 0, y: 1}
      - {row: 1, col: 1, x: 1, y: 1}
  - slug: full
    label: "Full (6 touches)"
    keys:
      - {row: 0, col: 0, x: 0, y: 0}
      - {row: 0, col: 1, x: 1, y: 0}
      - {row: 0, col: 2, x: 2, y: 0}
      - {row: 1, col: 0, x: 0, y: 1}
      - {row: 1, col: 1, x: 1, y: 1}
      - {row: 1, col: 2, x: 2, y: 1, w: 2.0}
