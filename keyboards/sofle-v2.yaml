model: sofle-v2
display_name: "Sofle v2.1 RGB"
vial_name: "Sofle"
vial_vid: "0xFC32"
vial_pid: "0x0287"
description: "Clavier split 60% avec encodeurs rotatifs, afficheur OLED 128×64 et LEDs RGB addressables per-key. Conçu par Josef Adamcik."
mcu_options:
  - id: rp2040
    display_name: "RP2040 (Sea Picro / Pro Micro RP2040)"
    description: "Microcontrôleur dual-core ARM Cortex-M0+ à 133 MHz, 264 KB RAM, 2 MB Flash. Recommandé pour Vial-QMK avec support OLED et RGB complet."
    bootloader: "rp2040"
    pins:
      matrix_rows: ["GP5", "GP6", "GP7", "GP8", "GP9"]
      matrix_cols: ["GP27", "GP26", "GP22", "GP20", "GP23", "GP21"]
      encoder_a: ["GP29"]
      encoder_b: ["GP28"]
      encoder_a_right: ["GP28"]
      encoder_b_right: ["GP29"]
      # WS2812 DATA = pad position 1 du footprint Pro Micro (silkscreen "GP0"
      # / "TX" sur Sparkfun Pro Micro RP2040 et Sea Picro). Validé empiriquement
      # par le firmware QMK fonctionnel sur l'ancien Sofle de l'utilisateur
      # (mêmes LEDs WS2812). Côté ZMK, ce même pad physique est `&pro_micro 1`
      # (= D1 Arduino = P0.06 sur SuperMini/nice!nano).
      # ⚠ Ne PAS confondre avec QMK `D1=GP2` du _pin_defs.h promicro_to_sparkfun_pm2040 :
      # c'est un alias logique Arduino historique, pas le silkscreen physique.
      ws2812: "GP0"
      serial_tx: "GP1"
      serial_driver: "vendor"
      ws2812_driver: "vendor"
      encoder_default_pos: "0x3"
  # ── ZMK wireless MCUs ──
  - id: nice_nano_v2
    display_name: "nice!nano v2 (nRF52840 BLE)"
    description: "Microcontrôleur sans fil nRF52840 BLE 5.0. Firmware ZMK. Charge LiPo intégrée. Support nice!view. RGB underglow uniquement."
    firmware: zmk
    bootloader: "adafruit-nrf52"
    pins:
      matrix_rows: ["&pro_micro 5", "&pro_micro 6", "&pro_micro 7", "&pro_micro 8", "&pro_micro 9"]
      matrix_cols: ["&pro_micro 19", "&pro_micro 18", "&pro_micro 15", "&pro_micro 14", "&pro_micro 16", "&pro_micro 10"]
      encoder_a: ["&pro_micro 21"]
      encoder_b: ["&pro_micro 20"]
      # WS2812 DATA = pad position 1 du footprint Pro Micro = `&pro_micro 1` en
      # ZMK = P0.06 sur SuperMini/nice!nano. C'est le même pad que `GP0` côté
      # Sparkfun Pro Micro RP2040 (silkscreen "GP0" / "TX") — validé sur les
      # deux PCB Sofle de l'utilisateur (ancien RP2040 et nouveau v2.1 RGB).
      # Note : la doc QMK sofle/info.json dit "D3" mais en QMK Arduino, "D1" et
      # "D3" ne réfèrent pas aux silkscreen physiques d'un Pro Micro RP2040 —
      # c'est encore une autre couche d'alias historique AVR. Ne pas s'y fier.
      ws2812: "&pro_micro 1"
  - id: supermini_nrf52840
    display_name: "SuperMini nRF52840 (BLE)"
    description: "Clone Pro Micro pas cher avec nRF52840 BLE 5.0. Firmware ZMK. RGB underglow uniquement."
    firmware: zmk
    bootloader: "adafruit-nrf52"
    pins:
      matrix_rows: ["&pro_micro 5", "&pro_micro 6", "&pro_micro 7", "&pro_micro 8", "&pro_micro 9"]
      matrix_cols: ["&pro_micro 19", "&pro_micro 18", "&pro_micro 15", "&pro_micro 14", "&pro_micro 16", "&pro_micro 10"]
      encoder_a: ["&pro_micro 21"]
      encoder_b: ["&pro_micro 20"]
      ws2812: "&pro_micro 1"
  - id: nrfmicro
    display_name: "nRFMicro 1.3 (nRF52840 BLE)"
    description: "MCU nRF52840 open-source avec BLE 5.0. Firmware ZMK. Charge LiPo intégrée. RGB underglow uniquement."
    firmware: zmk
    bootloader: "adafruit-nrf52"
    pins:
      matrix_rows: ["&pro_micro 5", "&pro_micro 6", "&pro_micro 7", "&pro_micro 8", "&pro_micro 9"]
      matrix_cols: ["&pro_micro 19", "&pro_micro 18", "&pro_micro 15", "&pro_micro 14", "&pro_micro 16", "&pro_micro 10"]
      encoder_a: ["&pro_micro 21"]
      encoder_b: ["&pro_micro 20"]
      ws2812: "&pro_micro 1"
diode_direction: "COL2ROW"
layout_macro: "LAYOUT"
vial_qmk_keyboard: "sofle/rev1"
has_encoder: true
capabilities:
  oled: true
  rgb: true
matrix:
  rows: 5
  cols: 6
oled:
  width: 64
  height: 128
  bits: 1
  driver: "ssd1306"
  rotation: 270
  display: "128X32"
rgb:
  max_brightness: 200
  # Longueur chaîne WS2812 par moitié (split). Sur Sofle v2.1 RGB :
  # 1 status LED (près OLED) + underglow + per-key. Valeur typique 35-36.
  # Ajuster si build échoue ou si LEDs s'éteignent au-delà d'un index.
  led_count: 36
  # OLED câblé sur la rail VCC commutée par P0.13 (ext_power) — partagée
  # avec la chaîne LED. Sans cette ligne, RGB_TOG couperait aussi l'OLED
  # qui ne se réinitialiserait pas au retour. Active désactive
  # CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER : LEDs gardent VDD en quiescent
  # (~1 mA × 36 = 36 mA par moitié quand "off") mais OLED préservé.
  oled_shares_ext_power: true
# Physical key positions (x, y in key units). Source: QMK info.json sofle/rev1
# Right side positions are normalized relative to left (x_min subtracted = 9.5)
layout:
  left:
    # row 0 — number row
    - {row: 0, col: 0, x: 0.0,  y: 0.5}
    - {row: 0, col: 1, x: 1.0,  y: 0.375}
    - {row: 0, col: 2, x: 2.0,  y: 0.125}
    - {row: 0, col: 3, x: 3.0,  y: 0.0}
    - {row: 0, col: 4, x: 4.0,  y: 0.125}
    - {row: 0, col: 5, x: 5.0,  y: 0.25}
    # row 1 — QWERTY
    - {row: 1, col: 0, x: 0.0,  y: 1.5}
    - {row: 1, col: 1, x: 1.0,  y: 1.375}
    - {row: 1, col: 2, x: 2.0,  y: 1.125}
    - {row: 1, col: 3, x: 3.0,  y: 1.0}
    - {row: 1, col: 4, x: 4.0,  y: 1.125}
    - {row: 1, col: 5, x: 5.0,  y: 1.25}
    # row 2 — home row
    - {row: 2, col: 0, x: 0.0,  y: 2.5}
    - {row: 2, col: 1, x: 1.0,  y: 2.375}
    - {row: 2, col: 2, x: 2.0,  y: 2.125}
    - {row: 2, col: 3, x: 3.0,  y: 2.0}
    - {row: 2, col: 4, x: 4.0,  y: 2.125}
    - {row: 2, col: 5, x: 5.0,  y: 2.25}
    # row 3 — bottom row
    - {row: 3, col: 0, x: 0.0,  y: 3.5}
    - {row: 3, col: 1, x: 1.0,  y: 3.375}
    - {row: 3, col: 2, x: 2.0,  y: 3.125}
    - {row: 3, col: 3, x: 3.0,  y: 3.0}
    - {row: 3, col: 4, x: 4.0,  y: 3.125}
    - {row: 3, col: 5, x: 5.0,  y: 3.25}
    # row 4 — encoder + thumb cluster (c0-c3 décalés pour coller c3 à c4)
    - {row: 4, col: 5, x: 6.0,  y: 2.75, encoder: true}
    - {row: 4, col: 0, x: 2.0,  y: 4.375}
    - {row: 4, col: 1, x: 3.0,  y: 4.125}
    - {row: 4, col: 2, x: 4.0,  y: 4.15}
    - {row: 4, col: 3, x: 5.0,  y: 4.25}
    - {row: 4, col: 4, x: 6.0,  y: 4.25}
  right:
    # row 0 — number row (miroir exact du côté gauche, x_right = 6 - x_left)
    - {row: 0, col: 5, x: 1.0,  y: 0.25}
    - {row: 0, col: 4, x: 2.0,  y: 0.125}
    - {row: 0, col: 3, x: 3.0,  y: 0.0}
    - {row: 0, col: 2, x: 4.0,  y: 0.125}
    - {row: 0, col: 1, x: 5.0,  y: 0.375}
    - {row: 0, col: 0, x: 6.0,  y: 0.5}
    # row 1
    - {row: 1, col: 5, x: 1.0,  y: 1.25}
    - {row: 1, col: 4, x: 2.0,  y: 1.125}
    - {row: 1, col: 3, x: 3.0,  y: 1.0}
    - {row: 1, col: 2, x: 4.0,  y: 1.125}
    - {row: 1, col: 1, x: 5.0,  y: 1.375}
    - {row: 1, col: 0, x: 6.0,  y: 1.5}
    # row 2
    - {row: 2, col: 5, x: 1.0,  y: 2.25}
    - {row: 2, col: 4, x: 2.0,  y: 2.125}
    - {row: 2, col: 3, x: 3.0,  y: 2.0}
    - {row: 2, col: 2, x: 4.0,  y: 2.125}
    - {row: 2, col: 1, x: 5.0,  y: 2.375}
    - {row: 2, col: 0, x: 6.0,  y: 2.5}
    # row 3
    - {row: 3, col: 5, x: 1.0,  y: 3.25}
    - {row: 3, col: 4, x: 2.0,  y: 3.125}
    - {row: 3, col: 3, x: 3.0,  y: 3.0}
    - {row: 3, col: 2, x: 4.0,  y: 3.125}
    - {row: 3, col: 1, x: 5.0,  y: 3.375}
    - {row: 3, col: 0, x: 6.0,  y: 3.5}
    # row 4 — encoder + thumb cluster (miroir du left corrigé : x_right = 6 - x_left)
    - {row: 4, col: 5, x: 0.0,  y: 2.75, encoder: true}
    - {row: 4, col: 0, x: 4.0,  y: 4.375}
    - {row: 4, col: 1, x: 3.0,  y: 4.125}
    - {row: 4, col: 2, x: 2.0,  y: 4.15}
    - {row: 4, col: 3, x: 1.0,  y: 4.25}
    - {row: 4, col: 4, x: 0.0,  y: 4.25}

# Keymap ZMK par défaut — ordre des bindings = ordre des colonnes de la matrice combinée.
# Pour un split à 6 colonnes : [left col 0..5, right col 0..5]. Sur le Sofle rev1, right col 0
# correspond à la touche la PLUS À DROITE physiquement (extérieur), right col 5 à la plus
# proche du gap central. Les bindings sont donc "miroirs" sur la moitié droite.
# Row 4 (thumb cluster) : 10 touches (cols 0-4 des deux moitiés, encodeur col 5 exclu).
default_keymap_zmk:
  default:
    - ["&kp ESC",   "&kp N1", "&kp N2", "&kp N3", "&kp N4", "&kp N5",   "&kp BSPC",  "&kp N0",   "&kp N9",  "&kp N8",    "&kp N7", "&kp N6"]
    - ["&kp TAB",   "&kp Q",  "&kp W",  "&kp E",  "&kp R",  "&kp T",    "&kp BSLH",  "&kp P",    "&kp O",   "&kp I",     "&kp U",  "&kp Y"]
    - ["&kp LSHFT", "&kp A",  "&kp S",  "&kp D",  "&kp F",  "&kp G",    "&kp SQT",   "&kp SEMI", "&kp L",   "&kp K",     "&kp J",  "&kp H"]
    - ["&kp LCTRL", "&kp Z",  "&kp X",  "&kp C",  "&kp V",  "&kp B",    "&kp RSHFT", "&kp FSLH", "&kp DOT", "&kp COMMA", "&kp M",  "&kp N"]
    - ["&kp LGUI",  "&kp LALT", "&kp LCTRL", "&lt 1 SPACE", "&kp RET",   "&kp RGUI",  "&kp RALT", "&kp RCTRL", "&lt 2 SPACE", "&kp RET"]
  lower:
    - ["&kp GRAVE", "&kp F1",   "&kp F2",   "&kp F3",   "&kp F4",   "&kp F5",     "&kp F11",  "&kp F10", "&kp F9",     "&kp F8",   "&kp F7",   "&kp F6"]
    - ["&trans",    "&kp N1",   "&kp N2",   "&kp N3",   "&kp N4",   "&kp N5",     "&kp F12",  "&kp N0",  "&kp N9",     "&kp N8",   "&kp N7",   "&kp N6"]
    - ["&trans",    "&trans",   "&trans",   "&trans",   "&trans",   "&trans",     "&trans",   "&trans",  "&kp RIGHT",  "&kp UP",   "&kp DOWN", "&kp LEFT"]
    - ["&trans",    "&trans",   "&trans",   "&trans",   "&trans",   "&trans",     "&trans",   "&trans",  "&trans",     "&trans",   "&trans",   "&trans"]
    - ["&trans",    "&trans",   "&trans",   "&trans",   "&trans",     "&trans",   "&trans",   "&trans",  "&trans",     "&trans"]
  raise:
    - ["&trans", "&trans",    "&trans",  "&trans",    "&trans",    "&trans",     "&trans", "&trans",   "&trans",   "&trans",   "&trans",   "&trans"]
    - ["&trans", "&kp EXCL",  "&kp AT",  "&kp HASH",  "&kp DLLR",  "&kp PRCNT",  "&trans", "&kp RPAR", "&kp LPAR", "&kp STAR", "&kp AMPS", "&kp CARET"]
    - ["&trans", "&trans",    "&trans",  "&trans",    "&trans",    "&trans",     "&trans", "&trans",   "&trans",   "&trans",   "&trans",   "&trans"]
    - ["&trans", "&trans",    "&trans",  "&trans",    "&trans",    "&trans",     "&trans", "&trans",   "&trans",   "&trans",   "&trans",   "&trans"]
    - ["&trans", "&trans",    "&trans",  "&trans",    "&trans",      "&trans",   "&trans", "&trans",   "&trans",   "&trans"]
