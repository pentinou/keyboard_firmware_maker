model: corne
display_name: "Corne (crkbd)"
description: "Clavier split 40% compact à 42 touches avec colonnes décalées. Conçu par foostan. Idéal pour une utilisation minimaliste."
mcu_options:
  - id: pro_micro
    display_name: "Pro Micro (ATmega32U4)"
    description: "Microcontrôleur Arduino classique compatible QMK. 32 KB Flash, 2.5 KB RAM. Compatible avec la plupart des PCB Corne."
  - id: elite_c
    display_name: "Elite-C v4 (ATmega32U4)"
    description: "Pro Micro amélioré avec connecteur USB-C et 5 pins supplémentaires. 32 KB Flash. Recommandé pour une utilisation durable."
  - id: rp2040
    display_name: "RP2040 (Nice!Nano v2 compatible)"
    description: "Microcontrôleur RP2040 — plus de mémoire, plus rapide, compatible Vial-QMK. Requiert une version PCB supportant ce footprint."
capabilities:
  oled: true
  rgb: false
matrix:
  rows: 4
  cols: 6
# Physical key positions (x, y in key units). Source: QMK info.json splitkb/aurora/corne/rev1
# Right side positions normalized (x_min = 8 subtracted)
layout:
  left:
    # row 0
    - {row: 0, col: 0, x: 0.0, y: 0.3}
    - {row: 0, col: 1, x: 1.0, y: 0.3}
    - {row: 0, col: 2, x: 2.0, y: 0.1}
    - {row: 0, col: 3, x: 3.0, y: 0.0}
    - {row: 0, col: 4, x: 4.0, y: 0.1}
    - {row: 0, col: 5, x: 5.0, y: 0.2}
    # row 1
    - {row: 1, col: 0, x: 0.0, y: 1.3}
    - {row: 1, col: 1, x: 1.0, y: 1.3}
    - {row: 1, col: 2, x: 2.0, y: 1.1}
    - {row: 1, col: 3, x: 3.0, y: 1.0}
    - {row: 1, col: 4, x: 4.0, y: 1.1}
    - {row: 1, col: 5, x: 5.0, y: 1.2}
    # row 2
    - {row: 2, col: 0, x: 0.0, y: 2.3}
    - {row: 2, col: 1, x: 1.0, y: 2.3}
    - {row: 2, col: 2, x: 2.0, y: 2.1}
    - {row: 2, col: 3, x: 3.0, y: 2.0}
    - {row: 2, col: 4, x: 4.0, y: 2.1}
    - {row: 2, col: 5, x: 5.0, y: 2.2}
    # row 3 — thumb cluster (3 keys)
    - {row: 3, col: 3, x: 4.0, y: 3.7}
    - {row: 3, col: 4, x: 5.0, y: 3.7}
    - {row: 3, col: 5, x: 6.0, y: 3.2}
  right:
    # row 0 (matrix rows 4-7 → per-side rows 0-3)
    - {row: 0, col: 5, x: 1.0, y: 0.2}
    - {row: 0, col: 4, x: 2.0, y: 0.1}
    - {row: 0, col: 3, x: 3.0, y: 0.0}
    - {row: 0, col: 2, x: 4.0, y: 0.1}
    - {row: 0, col: 1, x: 5.0, y: 0.3}
    - {row: 0, col: 0, x: 6.0, y: 0.3}
    # row 1
    - {row: 1, col: 5, x: 1.0, y: 1.2}
    - {row: 1, col: 4, x: 2.0, y: 1.1}
    - {row: 1, col: 3, x: 3.0, y: 1.0}
    - {row: 1, col: 2, x: 4.0, y: 1.1}
    - {row: 1, col: 1, x: 5.0, y: 1.3}
    - {row: 1, col: 0, x: 6.0, y: 1.3}
    # row 2
    - {row: 2, col: 5, x: 1.0, y: 2.2}
    - {row: 2, col: 4, x: 2.0, y: 2.1}
    - {row: 2, col: 3, x: 3.0, y: 2.0}
    - {row: 2, col: 2, x: 4.0, y: 2.1}
    - {row: 2, col: 1, x: 5.0, y: 2.3}
    - {row: 2, col: 0, x: 6.0, y: 2.3}
    # row 3 — thumb cluster (3 keys)
    - {row: 3, col: 5, x: 0.0, y: 3.2}
    - {row: 3, col: 4, x: 1.0, y: 3.7}
    - {row: 3, col: 3, x: 2.0, y: 3.7}
