model: pancakexxl
display_name: "PancakeXXL"
description: "Clavier 40% monoface 43 touches sur RP2040. Pas de split, pas d'OLED, pas de RGB."
split: false

mcu_options:
  - id: rp2040
    display_name: "RP2040"
    description: "RP2040 intégré. Bootloader UF2."
    bootloader: "rp2040"
    pins:
      matrix_rows: ["GP6", "GP4", "GP2", "GP25"]
      matrix_cols: ["GP12", "GP17", "GP18", "GP19", "GP20", "GP21", "GP22", "GP23", "GP24", "GP7", "GP3", "GP5"]

diode_direction: "COL2ROW"
layout_macro: "LAYOUT"
has_encoder: false

vial_vid: "0xEC08"
vial_pid: "0x8751"

capabilities:
  oled: false
  rgb: false

matrix:
  rows: 4
  cols: 12

layout_variants:
  - slug: standard
    label: "Standard (1.25-1-2-1-2-1-1.25)"
    keys:
      # Row 0 — 12 touches
      - {row: 0, col:  0, x:  0, y: 0}
      - {row: 0, col:  1, x:  1, y: 0}
      - {row: 0, col:  2, x:  2, y: 0}
      - {row: 0, col:  3, x:  3, y: 0}
      - {row: 0, col:  4, x:  4, y: 0}
      - {row: 0, col:  5, x:  5, y: 0}
      - {row: 0, col:  6, x:  6, y: 0}
      - {row: 0, col:  7, x:  7, y: 0}
      - {row: 0, col:  8, x:  8, y: 0}
      - {row: 0, col:  9, x:  9, y: 0}
      - {row: 0, col: 10, x: 10, y: 0}
      - {row: 0, col: 11, x: 11, y: 0}
      # Row 1 — 12 touches
      - {row: 1, col:  0, x:  0, y: 1}
      - {row: 1, col:  1, x:  1, y: 1}
      - {row: 1, col:  2, x:  2, y: 1}
      - {row: 1, col:  3, x:  3, y: 1}
      - {row: 1, col:  4, x:  4, y: 1}
      - {row: 1, col:  5, x:  5, y: 1}
      - {row: 1, col:  6, x:  6, y: 1}
      - {row: 1, col:  7, x:  7, y: 1}
      - {row: 1, col:  8, x:  8, y: 1}
      - {row: 1, col:  9, x:  9, y: 1}
      - {row: 1, col: 10, x: 10, y: 1}
      - {row: 1, col: 11, x: 11, y: 1}
      # Row 2 — 12 touches
      - {row: 2, col:  0, x:  0, y: 2}
      - {row: 2, col:  1, x:  1, y: 2}
      - {row: 2, col:  2, x:  2, y: 2}
      - {row: 2, col:  3, x:  3, y: 2}
      - {row: 2, col:  4, x:  4, y: 2}
      - {row: 2, col:  5, x:  5, y: 2}
      - {row: 2, col:  6, x:  6, y: 2}
      - {row: 2, col:  7, x:  7, y: 2}
      - {row: 2, col:  8, x:  8, y: 2}
      - {row: 2, col:  9, x:  9, y: 2}
      - {row: 2, col: 10, x: 10, y: 2}
      - {row: 2, col: 11, x: 11, y: 2}
      # Row 3 — 7 touches : 1.25 + 1 + 2 + 1 + 2 + 1 + 1.25 U
      - {row: 3, col:  1, x:  1,    y: 3, w: 1.25}
      - {row: 3, col:  2, x:  2.25, y: 3}
      - {row: 3, col:  4, x:  3.25, y: 3, w: 2}
      - {row: 3, col:  5, x:  5.25, y: 3}
      - {row: 3, col:  7, x:  6.25, y: 3, w: 2}
      - {row: 3, col:  8, x:  8.25, y: 3}
      - {row: 3, col:  9, x:  9.25, y: 3, w: 1.25}

