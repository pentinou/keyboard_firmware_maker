model: lily58
display_name: "Lily58"
description: "Clavier split 60% à 58 touches avec colonnes décalées et touches pouces supplémentaires. Conçu par kata0510. Bonne transition depuis un clavier standard."
mcu_options:
  - id: pro_micro
    display_name: "Pro Micro (ATmega32U4)"
    description: "Microcontrôleur Arduino classique compatible QMK. 32 KB Flash, 2.5 KB RAM. Option la plus courante pour le Lily58."
    bootloader: "caterina"
    pins:
      matrix_rows: ["D4", "C6", "D7", "E6"]
      matrix_cols: ["F4", "F5", "F6", "F7", "B1", "B3"]
      serial_tx: "D2"
      serial_driver: "bitbang"
  - id: elite_c
    display_name: "Elite-C v4 (ATmega32U4)"
    description: "Pro Micro amélioré avec connecteur USB-C et 5 pins supplémentaires. 32 KB Flash. Recommandé pour une utilisation durable."
    bootloader: "atmel-dfu"
    pins:
      matrix_rows: ["D4", "C6", "D7", "E6"]
      matrix_cols: ["F4", "F5", "F6", "F7", "B1", "B3"]
      serial_tx: "D2"
      serial_driver: "bitbang"
  - id: rp2040
    display_name: "RP2040 (Sea Picro / Pro Micro RP2040)"
    description: "Microcontrôleur RP2040 — plus de mémoire, compatible Vial-QMK. Requiert une version PCB Pro compatible."
    bootloader: "rp2040"
    pins:
      matrix_rows: ["GP4", "GP5", "GP6", "GP7"]
      matrix_cols: ["GP29", "GP28", "GP27", "GP26", "GP22", "GP20"]
      serial_tx: "GP1"
      serial_driver: "vendor"
  # ── ZMK wireless MCUs ──
  - id: nice_nano_v2
    display_name: "nice!nano v2 (nRF52840 BLE)"
    description: "Microcontrôleur sans fil nRF52840 BLE 5.0. Firmware ZMK. Charge LiPo intégrée. Support nice!view en option."
    firmware: zmk
    bootloader: "adafruit-nrf52"
    pins:
      matrix_rows: ["&pro_micro 4", "&pro_micro 5", "&pro_micro 6", "&pro_micro 7", "&pro_micro 8"]
      matrix_cols: ["&pro_micro 21", "&pro_micro 20", "&pro_micro 19", "&pro_micro 18", "&pro_micro 15", "&pro_micro 14"]
  - id: supermini_nrf52840
    display_name: "SuperMini nRF52840 (BLE)"
    description: "Clone Pro Micro pas cher avec nRF52840 BLE 5.0. Firmware ZMK. Format Pro Micro standard."
    firmware: zmk
    bootloader: "adafruit-nrf52"
    pins:
      matrix_rows: ["&pro_micro 4", "&pro_micro 5", "&pro_micro 6", "&pro_micro 7", "&pro_micro 8"]
      matrix_cols: ["&pro_micro 21", "&pro_micro 20", "&pro_micro 19", "&pro_micro 18", "&pro_micro 15", "&pro_micro 14"]
  - id: nrfmicro
    display_name: "nRFMicro 1.3 (nRF52840 BLE)"
    description: "MCU nRF52840 open-source avec BLE 5.0. Firmware ZMK. Charge LiPo intégrée."
    firmware: zmk
    bootloader: "adafruit-nrf52"
    pins:
      matrix_rows: ["&pro_micro 4", "&pro_micro 5", "&pro_micro 6", "&pro_micro 7", "&pro_micro 8"]
      matrix_cols: ["&pro_micro 21", "&pro_micro 20", "&pro_micro 19", "&pro_micro 18", "&pro_micro 15", "&pro_micro 14"]
diode_direction: "COL2ROW"
layout_macro: "LAYOUT"
vial_qmk_keyboard: "lily58/rev1"
has_encoder: false
capabilities:
  oled: true
  rgb: false
matrix:
  rows: 5
  cols: 6
oled:
  width: 64
  height: 128
  bits: 1
  driver: "ssd1306"
  rotation: 270
  display: "128X32"
# Physical key positions (x, y in key units). Source: QMK info.json splitkb/aurora/lily58/rev1
# Right side positions normalized (x_min = 9.5 subtracted)
layout:
  left:
    # row 0 — number row
    - {row: 0, col: 0, x: 0.0,  y: 0.5}
    - {row: 0, col: 1, x: 1.0,  y: 0.375}
    - {row: 0, col: 2, x: 2.0,  y: 0.125}
    - {row: 0, col: 3, x: 3.0,  y: 0.0}
    - {row: 0, col: 4, x: 4.0,  y: 0.125}
    - {row: 0, col: 5, x: 5.0,  y: 0.25}
    # row 1
    - {row: 1, col: 0, x: 0.0,  y: 1.5}
    - {row: 1, col: 1, x: 1.0,  y: 1.375}
    - {row: 1, col: 2, x: 2.0,  y: 1.125}
    - {row: 1, col: 3, x: 3.0,  y: 1.0}
    - {row: 1, col: 4, x: 4.0,  y: 1.125}
    - {row: 1, col: 5, x: 5.0,  y: 1.25}
    # row 2
    - {row: 2, col: 0, x: 0.0,  y: 2.5}
    - {row: 2, col: 1, x: 1.0,  y: 2.375}
    - {row: 2, col: 2, x: 2.0,  y: 2.125}
    - {row: 2, col: 3, x: 3.0,  y: 2.0}
    - {row: 2, col: 4, x: 4.0,  y: 2.125}
    - {row: 2, col: 5, x: 5.0,  y: 2.25}
    # row 3 — bottom row
    - {row: 3, col: 0, x: 0.0,  y: 3.5}
    - {row: 3, col: 1, x: 1.0,  y: 3.375}
    - {row: 3, col: 2, x: 2.0,  y: 3.125}
    - {row: 3, col: 3, x: 3.0,  y: 3.0}
    - {row: 3, col: 4, x: 4.0,  y: 3.125}
    - {row: 3, col: 5, x: 5.0,  y: 3.25}
    # row 4 — extra inner key + thumb cluster (c2-c4 décalés pour coller c4 à c5)
    - {row: 4, col: 1, x: 6.0,  y: 2.75}
    - {row: 4, col: 2, x: 3.0,  y: 4.15}
    - {row: 4, col: 3, x: 4.0,  y: 4.15}
    - {row: 4, col: 4, x: 5.0,  y: 4.25, h: 1.5}
    - {row: 4, col: 5, x: 6.0,  y: 4.25}
  right:
    # row 0 (miroir exact du côté gauche, x_right = 6 - x_left)
    - {row: 0, col: 5, x: 1.0,  y: 0.25}
    - {row: 0, col: 4, x: 2.0,  y: 0.125}
    - {row: 0, col: 3, x: 3.0,  y: 0.0}
    - {row: 0, col: 2, x: 4.0,  y: 0.125}
    - {row: 0, col: 1, x: 5.0,  y: 0.375}
    - {row: 0, col: 0, x: 6.0,  y: 0.5}
    # row 1
    - {row: 1, col: 5, x: 1.0,  y: 1.25}
    - {row: 1, col: 4, x: 2.0,  y: 1.125}
    - {row: 1, col: 3, x: 3.0,  y: 1.0}
    - {row: 1, col: 2, x: 4.0,  y: 1.125}
    - {row: 1, col: 1, x: 5.0,  y: 1.375}
    - {row: 1, col: 0, x: 6.0,  y: 1.5}
    # row 2
    - {row: 2, col: 5, x: 1.0,  y: 2.25}
    - {row: 2, col: 4, x: 2.0,  y: 2.125}
    - {row: 2, col: 3, x: 3.0,  y: 2.0}
    - {row: 2, col: 2, x: 4.0,  y: 2.125}
    - {row: 2, col: 1, x: 5.0,  y: 2.375}
    - {row: 2, col: 0, x: 6.0,  y: 2.5}
    # row 3
    - {row: 3, col: 5, x: 1.0,  y: 3.25}
    - {row: 3, col: 4, x: 2.0,  y: 3.125}
    - {row: 3, col: 3, x: 3.0,  y: 3.0}
    - {row: 3, col: 2, x: 4.0,  y: 3.125}
    - {row: 3, col: 1, x: 5.0,  y: 3.375}
    - {row: 3, col: 0, x: 6.0,  y: 3.5}
    # row 4 — miroir du left corrigé : x_right = 6 - x_left
    - {row: 4, col: 1, x: 0.0,  y: 2.75}
    - {row: 4, col: 5, x: 0.0,  y: 4.25}
    - {row: 4, col: 4, x: 1.0,  y: 4.25, h: 1.5}
    - {row: 4, col: 3, x: 2.0,  y: 4.15}
    - {row: 4, col: 2, x: 3.0,  y: 4.15}

# Keymap ZMK par défaut — 5 rows × 12 cols combined (rows 0-3) + 10 thumbs row 4.
# Convention KFM : right cols miroir (binding 6 = extérieur droit, binding 11 = près gap).
# Row 4 : extra-inner-left, 4 thumbs gauches, extra-inner-right, 4 thumbs droits.
default_keymap_zmk:
  default:
    - ["&kp ESC",   "&kp N1", "&kp N2", "&kp N3", "&kp N4", "&kp N5",   "&kp BSPC",  "&kp N0",   "&kp N9",  "&kp N8",    "&kp N7", "&kp N6"]
    - ["&kp TAB",   "&kp Q",  "&kp W",  "&kp E",  "&kp R",  "&kp T",    "&kp MINUS", "&kp P",    "&kp O",   "&kp I",     "&kp U",  "&kp Y"]
    - ["&kp LCTRL", "&kp A",  "&kp S",  "&kp D",  "&kp F",  "&kp G",    "&kp SQT",   "&kp SEMI", "&kp L",   "&kp K",     "&kp J",  "&kp H"]
    - ["&kp LSHFT", "&kp Z",  "&kp X",  "&kp C",  "&kp V",  "&kp B",    "&kp RSHFT", "&kp FSLH", "&kp DOT", "&kp COMMA", "&kp M",  "&kp N"]
    - ["&kp LBKT",  "&kp LGUI", "&kp LALT", "&lt 1 SPACE", "&kp RET",   "&kp RBKT",  "&kp RGUI", "&kp BSPC", "&lt 2 SPACE", "&kp RET"]
  lower:
    - ["&kp GRAVE", "&kp F1",   "&kp F2",   "&kp F3",   "&kp F4",   "&kp F5",     "&kp F11",  "&kp F10", "&kp F9",     "&kp F8",   "&kp F7",   "&kp F6"]
    - ["&trans",    "&kp N1",   "&kp N2",   "&kp N3",   "&kp N4",   "&kp N5",     "&kp F12",  "&kp N0",  "&kp N9",     "&kp N8",   "&kp N7",   "&kp N6"]
    - ["&trans",    "&trans",   "&trans",   "&trans",   "&trans",   "&trans",     "&trans",   "&trans",  "&kp RIGHT",  "&kp UP",   "&kp DOWN", "&kp LEFT"]
    - ["&trans",    "&trans",   "&trans",   "&trans",   "&trans",   "&trans",     "&trans",   "&trans",  "&trans",     "&trans",   "&trans",   "&trans"]
    - ["&trans",    "&trans",   "&trans",   "&trans",   "&trans",     "&trans",   "&trans",   "&trans",  "&trans",     "&trans"]
  raise:
    - ["&trans", "&trans",    "&trans",  "&trans",    "&trans",    "&trans",     "&trans", "&trans",   "&trans",   "&trans",   "&trans",   "&trans"]
    - ["&trans", "&kp EXCL",  "&kp AT",  "&kp HASH",  "&kp DLLR",  "&kp PRCNT",  "&trans", "&kp RPAR", "&kp LPAR", "&kp STAR", "&kp AMPS", "&kp CARET"]
    - ["&trans", "&trans",    "&trans",  "&trans",    "&trans",    "&trans",     "&trans", "&trans",   "&trans",   "&trans",   "&trans",   "&trans"]
    - ["&trans", "&trans",    "&trans",  "&trans",    "&trans",    "&trans",     "&trans", "&trans",   "&trans",   "&trans",   "&trans",   "&trans"]
    - ["&trans", "&trans",    "&trans",  "&trans",    "&trans",      "&trans",   "&trans", "&trans",   "&trans",   "&trans"]
