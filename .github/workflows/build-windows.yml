name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test-windows:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-qt

      - name: Run tests
        run: python -m pytest --tb=short -q

  build-exe:
    name: Build PyInstaller exe
    runs-on: windows-latest
    needs: test-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller>=6.0

      - name: Build with PyInstaller
        run: pyinstaller keyboard_firmware_maker.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardFirmwareMaker-windows
          path: dist/KeyboardFirmwareMaker/
          retention-days: 30

  build-installer:
    name: Build Inno Setup installer
    runs-on: windows-latest
    needs: build-exe
    steps:
      - uses: actions/checkout@v4

      - name: Download exe artifact
        uses: actions/download-artifact@v4
        with:
          name: KeyboardFirmwareMaker-windows
          path: dist/KeyboardFirmwareMaker/

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer/kfm_setup.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardFirmwareMaker-installer
          path: dist/KeyboardFirmwareMaker_Setup_*.exe
          retention-days: 30
